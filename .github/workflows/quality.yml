name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests with branch coverage
        run: python -m pytest

      - name: Enforce architecture-layer coverage
        run: |
          python -m coverage report \
            --include='src/domain/*,src/application/*' \
            --fail-under=90

      - name: Check architecture-layer lint
        shell: bash
        run: |
          paths=(tests/test_architecture_boundaries.py)
          [[ -d src/domain ]] && paths+=(src/domain)
          [[ -d src/application ]] && paths+=(src/application)
          python -m ruff check "${paths[@]}"
          python -m ruff format --check "${paths[@]}"

      - name: Type-check strict architecture layers
        shell: bash
        run: |
          paths=()
          [[ -d src/domain ]] && paths+=(src/domain)
          [[ -d src/application ]] && paths+=(src/application)
          if (( ${#paths[@]} )); then
            python -m mypy "${paths[@]}"
          else
            echo "Architecture layers do not exist yet; strict mypy gate skipped."
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
